schema_version: "1.1"
name: ext-long-transcript-detail
expected_outcome: |
  一个自包含的单文件 HTML 录音详情页，能在「短录音（约 70 字）」「长会议逐句转写（20 句、2 位说话人、>1000 字）」与「无时间戳长纯文本」三种数据样本间切换，同时适配桌面端与 390px 手机端：同域顶部返回条与工作区宽度一致；无人工标题时取多句摘要首句并去掉末尾多余句号，面包屑单行限宽防横穿；吸顶紧凑播放条配左宽主阅读列（摘要 + 自然流转写正文，无框中框滚动条）与右吸顶信息栏（入长期记忆确认 + 录音信息）；长转写默认折叠预览支持展开/收起/回顶、条件文内搜索高亮（不注入 HTML）、多说话人筛选与纯文本视觉分段（导出原文不变）；删除使用危险态配确认拦截，支持键盘、减少动效，并按规范分开说明来源。

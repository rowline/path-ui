<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>家里的待办</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #fff; color: #000; }
  :focus { outline: none; }
  header { position: sticky; top: 0; display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: #e8453c; color: #fff; }
  header h1 { margin: 0; font-size: 18px; }
  .bell { width: 28px; height: 28px; border: 0; border-radius: 6px; background: #e8453c; color: #fff; font-size: 16px; cursor: pointer; animation: wiggle 1.2s ease-in-out infinite; }
  @keyframes wiggle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-12deg); } 75% { transform: rotate(12deg); } }
  .filters { display: flex; gap: 6px; padding: 10px 16px; }
  .filters button { height: 28px; padding: 0 10px; border: 0; border-radius: 6px; background: #e8453c; color: #fff; cursor: pointer; }
  .filters button.on { color: #ffe08a; }
  .add { margin: 0 16px; height: 28px; padding: 0 12px; border: 0; border-radius: 6px; background: #e8453c; color: #fff; cursor: pointer; }
  ul { list-style: none; margin: 8px 0; padding: 0 16px; }
  li { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid #ddd; animation: bounceIn .6s cubic-bezier(.2, 1.8, .4, 1) both; }
  li:nth-child(2) { animation-delay: .1s; } li:nth-child(3) { animation-delay: .2s; } li:nth-child(4) { animation-delay: .3s; }
  @keyframes bounceIn { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  li .title { flex: 1; }
  li .when { color: #bbb; font-size: 12px; }
  .tag { padding: 1px 6px; border-radius: 4px; background: #ffd84d; color: #fff; font-size: 12px; }
  li .del { height: 24px; padding: 0 8px; border: 0; border-radius: 6px; background: #e8453c; color: #fff; cursor: pointer; }
  .clear { margin: 8px 16px; height: 28px; padding: 0 12px; border: 0; border-radius: 6px; background: #e8453c; color: #fff; }
  .spinner { width: 28px; height: 28px; margin: 40px auto; border: 3px solid #eee; border-top-color: #e8453c; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast { position: fixed; left: 50%; top: 16px; transform: translateX(-50%); padding: 8px 14px; border-radius: 8px; background: #333; color: #fff; }
  .scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .5); display: grid; place-items: center; animation: fade .3s; }
  .dialog { width: 300px; padding: 16px; border-radius: 10px; background: #fff; }
  .dialog input { width: 100%; height: 32px; margin: 8px 0; }
  @keyframes fade { from { opacity: 0; } }
</style>
</head>
<body>
<header><h1>家里的待办</h1><button class="bell" title="提醒">🔔</button></header>
<div class="filters">
  <button class="on" data-f="all">全部</button>
  <button data-f="todo">没做的</button>
  <button data-f="done">做完的</button>
</div>
<button class="add" id="add">添加</button>
<div id="list"><div class="spinner"></div></div>
<button class="clear" id="clear">清空做完的</button>

<script>
const items = [
  { id: 1, title: '交电费', who: '爸爸', when: '2026-11-14 09:12', tag: '缴费', done: false },
  { id: 2, title: '给外婆买降压药', who: '妈妈', when: '2026-11-13 18:40', tag: '健康', done: false },
  { id: 3, title: '周六带朵朵去少年宫', who: '妈妈', when: '2026-11-12 20:05', tag: '孩子', done: true },
  { id: 4, title: '物业费', who: '爸爸', when: '2026-11-10 08:30', tag: '缴费', done: false },
];
let filter = 'all';

function toast(text) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = text;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 1800);
}

function render() {
  const list = document.getElementById('list');
  const shown = items.filter((i) => filter === 'all' || (filter === 'done' ? i.done : !i.done));
  list.innerHTML = '<ul>' + shown.map((i) => `
    <li>
      <input type="checkbox" data-id="${i.id}" ${i.done ? 'checked' : ''}>
      <span class="title">${i.title}</span>
      <span class="tag">${i.tag}</span>
      <span class="when">${i.who} · ${i.when}</span>
      <button class="del" data-id="${i.id}">删除</button>
    </li>`).join('') + '</ul>';
  document.getElementById('clear').style.display = items.some((i) => i.done) ? '' : 'none';
}

setTimeout(render, 200);

document.querySelector('.filters').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  document.querySelectorAll('.filters button').forEach((x) => x.classList.toggle('on', x === b));
  filter = b.dataset.f;
  render();
});

document.getElementById('list').addEventListener('change', (e) => {
  const it = items.find((i) => i.id === Number(e.target.dataset.id));
  it.done = e.target.checked;
  render();
  toast('保存成功');
});

document.getElementById('list').addEventListener('click', (e) => {
  if (!e.target.classList.contains('del')) return;
  if (!confirm('确定要删除吗？')) return;
  const idx = items.findIndex((i) => i.id === Number(e.target.dataset.id));
  items.splice(idx, 1);
  render();
  toast('删除成功');
});

document.getElementById('clear').addEventListener('click', () => {
  for (let i = items.length - 1; i >= 0; i--) if (items[i].done) items.splice(i, 1);
  render();
  toast('已清空');
});

document.getElementById('add').addEventListener('click', () => {
  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  scrim.innerHTML = '<div class="dialog"><b>新待办</b><input placeholder="要做什么"><button id="ok">好</button></div>';
  document.body.appendChild(scrim);
  scrim.querySelector('#ok').onclick = () => {
    const v = scrim.querySelector('input').value.trim();
    if (v) items.unshift({ id: Date.now(), title: v, who: '我', when: '2026-11-14 10:00', tag: '其他', done: false });
    scrim.remove();
    render();
    toast('保存成功');
  };
});
</script>
</body>
</html>

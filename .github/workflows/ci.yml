name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install pyyaml

      - name: Validate skill specification and assets
        run: python3 scripts/validate_skill.py

      - name: Build .skill package
        run: python3 scripts/package_skill.py -o dist/path-ui.skill

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.5.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install pyyaml

      - name: Validate skill
        run: python3 scripts/validate_skill.py

      - name: Package path-ui.skill
        run: python3 scripts/package_skill.py -o dist/path-ui.skill

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          ver = tag.lstrip("v")
          text = Path("CHANGELOG.md").read_text(encoding="utf-8") if Path("CHANGELOG.md").is_file() else ""
          pattern = re.compile(rf"^## \[{re.escape(ver)}\][^\n]*\n(.*?)(?=^## \[|\Z)", re.M | re.S)
          m = pattern.search(text)
          out = Path("/tmp/release-notes.md")
          gh_out = Path(os.environ["GITHUB_OUTPUT"])
          if m and m.group(1).strip():
              body = m.group(1).strip() + "\n\n---\n`path-ui.skill` 不含 `evals/` 与 `vendor-skills/`。"
              out.write_text(body, encoding="utf-8")
              with gh_out.open("a", encoding="utf-8") as f:
                  f.write("has_notes=true\n")
          else:
              with gh_out.open("a", encoding="utf-8") as f:
                  f.write("has_notes=false\n")
          PY

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/path-ui.skill --clobber
          elif [ "${{ steps.notes.outputs.has_notes }}" = "true" ]; then
            gh release create "$RELEASE_TAG" dist/path-ui.skill \
              --title "path-ui $RELEASE_TAG" \
              --notes-file /tmp/release-notes.md
          else
            gh release create "$RELEASE_TAG" dist/path-ui.skill \
              --title "path-ui $RELEASE_TAG" \
              --generate-notes
          fi
